services:
  postgres:
    image: postgres:16-alpine
    container_name: solutijuris-db
    environment:
      POSTGRES_DB: solutijuris
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - solutijuris-net

  redis:
    image: redis:7-alpine
    container_name: solutijuris-cache
    ports:
      - "6379:6379"
    networks:
      - solutijuris-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: solutijuris-queue
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - solutijuris-net

volumes:
  postgres_data:

networks:
  solutijuris-net:
    driver: bridge