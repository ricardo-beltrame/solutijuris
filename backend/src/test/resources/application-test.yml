spring:
  datasource:
    url: jdbc:h2:mem:solutijuris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:chave-super-secreta-solutijuris-2026-para-teste-com-32-caracteres}
  expiration: 3600000