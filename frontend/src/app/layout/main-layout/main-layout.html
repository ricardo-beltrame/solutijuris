<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Menu" matTooltip="Menu">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title">
    <mat-icon class="logo-icon">balance</mat-icon>
    SolutiJuris
  </span>

  <span class="spacer"></span>

  @if (!isMobile()) {
    <mat-form-field appearance="outline" class="toolbar-search" subscriptSizing="dynamic">
      <mat-label>Buscar processo, prazo...</mat-label>
      <input matInput />
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <span class="spacer"></span>
  }

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Usuário" [matTooltip]="userNome">
    <div class="user-avatar">{{ iniciais }}</div>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-info-menu">
      <mat-icon>person</mat-icon>
      <div>
        <div class="user-name">{{ userNome }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="toggleTheme()">
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ isDark() ? 'Tema claro' : 'Tema escuro' }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="app-sidenav"
  >
    <div class="nav-section-label">Navegação</div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="nav-section-label">Sistema</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/configuracoes" routerLinkActive="active-link">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Configurações</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      SolutiJuris v1.0 — © 2026
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="app-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
