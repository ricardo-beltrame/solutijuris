<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" aria-label="Menu" matTooltip="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title">SolutioJuris</span>
  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Usuário" [matTooltip]="userNome">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="user-info-menu">
      <mat-icon>person</mat-icon>
      <div>
        <div class="user-name">{{ userNome }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="toggleTheme()">
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ isDark() ? 'Tema claro' : 'Tema escuro' }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="app-sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="app-sidenav"
  >
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="app-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
